<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>UCPUSA — Добро пожаловать</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", Roboto, sans-serif;
        background: radial-gradient(circle at center, #c0294b, #2a0b0f 75%);
        overflow: hidden;
        color: white;
        position: relative;
    }

    /* Лого в центре */
    .logo {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.6);
        font-size: 46px;
        font-weight: 700;
        opacity: 0;
        animation: logoIn 1.1s ease forwards;
    }

    @keyframes logoIn {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
        100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    /* Нижний блок */
    .panel {
        width: 100%;
        text-align: center;
        padding: 40px 24px;
        box-sizing: border-box;
        opacity: 0;
        transform: translateY(80px);
        animation: panelIn 0.8s ease 0.8s forwards;
    }

    @keyframes panelIn {
        0% { opacity: 0; transform: translateY(80px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    .title {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 4px;
    }

    .subtitle {
        font-size: 13px;
        line-height: 1.5;
        opacity: 0.9;
        margin-bottom: 24px;
    }

    /* Индикаторы */
    .dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-bottom: 26px;
    }

    .dots div {
        width: 18px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255,255,255,0.25);
    }

    .dots div.active {
        background: white;
    }

    /* Кнопка Далее */
    .btn-main {
        background: linear-gradient(90deg, #ff416c, #ff0033);
        color: white;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 600;
        padding: 14px;
        width: 100%;
        border: none;
        margin-bottom: 16px;
    }

    /* Кнопка Пропустить */
    .btn-skip {
        background: transparent;
        border: none;
        color: white;
        font-size: 14px;
        opacity: 0.7;
        text-decoration: none;
    }

    .bottom-label {
        margin-top: 14px;
        font-size: 11px;
        opacity: 0.4;
    }
</style>
</head>
<body>

    <div class="logo">UCPUSA</div>

    <div class="panel">
        <div class="title">Коммунистическая партия<br>UCPUSA</div>
        <div class="subtitle">Начинай политическую жизнь<br>в нашем Штате с нас.</div>

        <div class="dots">
            <div class="active"></div>
            <div></div>
            <div></div>
        </div>

        <button class="btn-main" onclick="nextPage()">Далее</button>
        <button class="btn-skip" onclick="skip()">Пропустить</button>

        <div class="bottom-label">UCPUSA</div>
    </div>

<script>
    function nextPage() {
        Telegram.WebApp.sendData(JSON.stringify({ action: "next" }));
    }

    function skip() {
        Telegram.WebApp.sendData(JSON.stringify({ action: "skip" }));
    }
</script>

</body>
</html>
