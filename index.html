<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>UCPUSA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
    }

    body {
        width: 100vw;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", Roboto, sans-serif;
        background: radial-gradient(circle at 70% 20%, #ff6eb0, #2b000c 75%);
        animation: breathe 6s ease-in-out infinite;
        overflow: hidden;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 26px;
    }

    @keyframes breathe {
        0% { background-size: 100%; }
        50% { background-size: 130%; }
        100% { background-size: 100%; }
    }

    .content {
        max-width: 400px;
        margin-bottom: 40px;
    }

    .title {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 8px;
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.7s cubic-bezier(.25,.9,.35,1);
    }

    .subtitle {
        font-size: 14px;
        line-height: 1.5;
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.7s cubic-bezier(.25,.9,.35,1);
    }

    .active {
        opacity: 1;
        transform: translateY(0);
    }

    .dots {
        display: flex;
        gap: 6px;
        margin: 24px 0;
    }

    .dot {
        width: 16px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255,255,255,0.25);
        transition: .25s;
    }

    .dot.active {
        background: white;
        width: 26px;
    }

    .dot:hover {
        cursor: pointer;
        background: rgba(255,255,255,0.6);
    }

    .btn-main {
        background: linear-gradient(90deg, #ff416c, #ff0033);
        color: white;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 600;
        padding: 14px;
        width: 100%;
        border: none;
        margin-bottom: 16px;
        transition: .25s;
    }

    .btn-main:active {
        transform: scale(.97);
    }

    .btn-skip {
        background: transparent;
        border: none;
        color: white;
        opacity: .7;
        font-size: 15px;
        transition: .25s;
    }

    .btn-skip:active {
        transform: scale(.97);
    }

    .bottom-label {
        text-align: center;
        margin-top: 18px;
        font-size: 11px;
        opacity: 0.35;
        width: 100%;
    }
</style>
</head>
<body>

<div class="content">
    <div class="title" id="title"></div>
    <div class="subtitle" id="subtitle"></div>
</div>

<div class="dots">
    <div class="dot" onclick="go(0)"></div>
    <div class="dot" onclick="go(1)"></div>
    <div class="dot" onclick="go(2)"></div>
</div>

<button class="btn-main" onclick="next()">Далее</button>
<button class="btn-skip" onclick="finish()">Пропустить</button>

<div class="bottom-label">UCPUSA</div>

<script>
const pages = [
    {
        title: "Коммунистическая партия UCPUSA",
        subtitle: "Начинай политическую жизнь в нашем штате с нами."
    },
    {
        title: "Голос народа",
        subtitle: "Стань частью движения и помоги строить будущее."
    },
    {
        title: "К единству и свободе!",
        subtitle: "Вступай и меняй мир вместе с нами."
    }
];

let index = 0;
const titleEl = document.getElementById("title");
const subtitleEl = document.getElementById("subtitle");
const dots = document.querySelectorAll(".dot");

function animateText(nextIndex) {
    titleEl.classList.remove("active");
    subtitleEl.classList.remove("active");

    setTimeout(() => {
        titleEl.innerText = pages[nextIndex].title;
        subtitleEl.innerText = pages[nextIndex].subtitle;

        titleEl.classList.add("active");
        subtitleEl.classList.add("active");
    }, 200);
}

function updateDots() {
    dots.forEach((d, i) => d.classList.toggle("active", i === index));
}

function go(i) {
    index = i;
    animateText(i);
    updateDots();
}

function next() {
    if (index < pages.length - 1) {
        index++;
        animateText(index);
        updateDots();
    } else {
        finish();
    }
}

function finish() {
    Telegram.WebApp.sendData(JSON.stringify({ action: "finished" }));
}

document.body.addEventListener("touchstart", e => startX = e.touches[0].clientX);
document.body.addEventListener("touchend", e => {
    let dx = e.changedTouches[0].clientX - startX;
    if (dx < -50 && index < pages.length - 1) next();
    if (dx > 50 && index > 0) { index--; go(index); }
});

// Первое появление
animateText(0);
dots[0].classList.add("active");
</script>

</body>
</html>
