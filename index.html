<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>UCPUSA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
    }

    body {
        width: 100vw;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", Roboto, sans-serif;
        background: #000;
        overflow: hidden;
        color: white;
        position: relative;
    }

    /* ЗАСТАВКА */
    .splash {
        position: absolute;
        height: 100%;
        width: 100%;
        background: radial-gradient(circle at center, #b51c44, #100000 80%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        opacity: 1;
        animation: splashFade 1.2s ease 1.5s forwards;
    }

    .splash-logo {
        font-size: 46px;
        font-weight: 800;
        opacity: 0;
        transform: scale(0.4);
        animation: logoIn 1.5s cubic-bezier(.2,1.6,.35,1) forwards;
    }

    @keyframes logoIn {
        0%   { opacity: 0; transform: scale(0.4); }
        100% { opacity: 1; transform: scale(1); }
    }

    @keyframes splashFade {
        0% { opacity: 1; }
        100% { opacity: 0; visibility: hidden; }
    }

    /* КОНТЕЙНЕР СЛАЙДОВ */
    .slides {
        position: absolute;
        width: 300%;
        height: 100%;
        display: flex;
        transition: transform .6s cubic-bezier(.25,.9,.35,1);
    }

    .slide {
        width: 100vw;
        height: 100vh;
        flex-shrink: 0;
        padding: 40px 24px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        position: relative;

        /* Живой градиент */ 
        background: radial-gradient(
            circle at 70% 25%,
            #ff6eb0,
            #32000e 75%
        );
        animation: breathe 6s ease-in-out infinite;
    }

    @keyframes breathe {
        0%   { background-size: 100%; }
        50%  { background-size: 130%; }
        100% { background-size: 100%; }
    }

    /* Тексты */
    .title {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 8px;
        transform: translateY(35px);
        opacity: 0;
        transition: .6s;
    }

    .subtitle {
        font-size: 14px;
        opacity: .9;
        line-height: 1.4;
        margin-bottom: 32px;
        transform: translateY(35px);
        opacity: 0;
        transition: .6s;
    }

    .slide.active .title,
    .slide.active .subtitle {
        transform: translateY(0);
        opacity: 1;
    }

    /* ИНДИКАТОРЫ */
    .dots {
        display: flex;
        gap: 6px;
        margin-bottom: 26px;
    }

    .dot {
        width: 16px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255,255,255,0.25);
        transition: .25s;
    }

    .dot.active {
        background: white;
        width: 26px;
    }

    .dot:hover {
        background: rgba(255,255,255,0.8);
        cursor: pointer;
    }

    /* КНОПКИ */
    .btn-main {
        background: linear-gradient(90deg, #ff416c, #ff0033);
        color: white;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 600;
        padding: 14px;
        width: 100%;
        border: none;
        margin-bottom: 16px;
        transition: .2s;
    }

    .btn-main:active {
        transform: scale(.97);
    }

    .btn-skip {
        background: transparent;
        border: none;
        color: white;
        font-size: 14px;
        opacity: 0.7;
        transition: .2s;
    }

    .btn-skip:active {
        transform: scale(.97);
    }

    .bottom-label {
        text-align: center;
        margin-top: 14px;
        font-size: 11px;
        opacity: 0.4;
        margin-bottom: 20px;
    }
</style>
</head>
<body>

<div class="splash">
    <div class="splash-logo">UCPUSA</div>
</div>

<div class="slides" id="slides">

    <!-- 1 -->
    <div class="slide active">
        <div class="title">Коммунистическая партия<br>UCPUSA</div>
        <div class="subtitle">Начинай политическую жизнь<br>в нашем Штате с нас.</div>

        <div class="dots">
            <div class="dot active" onclick="goTo(0)"></div>
            <div class="dot" onclick="goTo(1)"></div>
            <div class="dot" onclick="goTo(2)"></div>
        </div>

        <button class="btn-main" onclick="next()">Далее</button>
        <button class="btn-skip" onclick="finish()">Пропустить</button>

        <div class="bottom-label">UCPUSA</div>
    </div>

    <!-- 2 -->
    <div class="slide">
        <div class="title">Голос в народа</div>
        <div class="subtitle">Стань частью движения<br>и помоги строить новое будущее.</div>

        <div class="dots">
            <div class="dot" onclick="goTo(0)"></div>
            <div class="dot active" onclick="goTo(1)"></div>
            <div class="dot" onclick="goTo(2)"></div>
        </div>

        <button class="btn-main" onclick="next()">Далее</button>
        <button class="btn-skip" onclick="finish()">Пропустить</button>

        <div class="bottom-label">UCPUSA</div>
    </div>

    <!-- 3 -->
    <div class="slide">
        <div class="title">К единству и свободе!</div>
        <div class="subtitle">Вступай и прокладывай<br>путь вместе с нами.</div>

        <div class="dots">
            <div class="dot" onclick="goTo(0)"></div>
            <div class="dot" onclick="goTo(1)"></div>
            <div class="dot active" onclick="goTo(2)"></div>
        </div>

        <button class="btn-main" onclick="finish()">Начать</button>
        <button class="btn-skip" onclick="finish()">Пропустить</button>

        <div class="bottom-label">UCPUSA</div>
    </div>

</div>

<script>
    let current = 0;
    const slides = document.getElementById("slides");
    const list = document.querySelectorAll(".slide");
    const total = list.length;

    function update() {
        slides.style.transform = `translateX(-${current * 100}vw)`;

        list.forEach((s, i) => {
            if (i === current) s.classList.add("active");
            else s.classList.remove("active");

            document.querySelectorAll(".dot").forEach((d, j) => {
                if (Math.floor(j / total) === 0) return; 
            });
        });

        document.querySelectorAll(".dots").forEach((group, i) => {
            const dots = group.querySelectorAll(".dot");
            dots.forEach((d, j) => d.classList.toggle("active", j === current));
        });
    }

    function next() {
        current = Math.min(current + 1, total - 1);
        update();
    }

    function goTo(x) {
        current = x;
        update();
    }

    function finish() {
        Telegram.WebApp.sendData(JSON.stringify({ action: "finished" }));
    }

    /* Свайпы */
    let startX = 0;

    slides.addEventListener("touchstart", e => {
        startX = e.touches[0].clientX;
    });

    slides.addEventListener("touchend", e => {
        let dx = e.changedTouches[0].clientX - startX;
        if (dx < -60 && current < total - 1) current++;
        if (dx > 60 && current > 0) current--;
        update();
    });
</script>

</body>
</html>
