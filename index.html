<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>UCPUSA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    /* ОБЩЕЕ */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
    }

    body {
        width: 100vw;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", Roboto, sans-serif;
        background: #000;
        overflow: hidden;
        color: white;
        position: relative;
    }

    /* ======================
       ЭКРАН ЗАСТАВКИ
       ======================*/
    .splash {
        position: absolute;
        height: 100%;
        width: 100%;
        background: radial-gradient(circle at center, #ad1c43, #1a0000 80%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        opacity: 1;
        animation: splashFade 1.2s ease 1.7s forwards;
    }

    .splash-logo {
        font-size: 46px;
        font-weight: 800;
        opacity: 0;
        transform: scale(0.4);
        animation: logoIn 1.4s ease forwards;
    }

    @keyframes logoIn {
        0% { opacity: 0; transform: scale(0.4); }
        100% { opacity: 1; transform: scale(1); }
    }

    @keyframes splashFade {
        0% { opacity: 1; }
        100% { opacity: 0; visibility: hidden; }
    }

    /* ======================
       КОНТЕЙНЕР СТУПЕНЕЙ
       ======================*/
    .slides {
        position: absolute;
        width: 100%;
        height: 100%;
        transform: translateX(0);
        display: flex;
        touch-action: none;
        transition: transform .45s cubic-bezier(.2, .9, .35, 1);
    }

    .slide {
        width: 100%;
        height: 100%;
        flex-shrink: 0;
        padding: 40px 24px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: radial-gradient(circle at 70% 20%, #ff6eb0, #2b000c 80%);
    }

    .title {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 4px;
    }

    .subtitle {
        font-size: 13px;
       .opacity: .9;
        line-height: 1.4;
        margin-bottom: 24px;
    }

    /* ======= ИНДИКАТОРЫ ======= */
    .dots {
        display: flex;
        gap: 6px;
        margin-bottom: 26px;
    }

    .dot {
        width: 18px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255,255,255,0.25);
        transition: .25s;
    }

    .dot.active {
        background: white;
        width: 28px;
    }

    /* ====== КНОПКИ ====== */
    .btn-main {
        background: linear-gradient(90deg, #ff416c, #ff0033);
        color: white;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 600;
        padding: 14px;
        width: 100%;
        border: none;
        margin-bottom: 16px;
    }

    .btn-skip {
        background: transparent;
        border: none;
        color: white;
        font-size: 14px;
        opacity: 0.7;
    }

    .bottom-label {
        text-align: center;
        margin-top: 14px;
        font-size: 11px;
        opacity: 0.4;
        margin-bottom: 20px;
    }
</style>
</head>
<body>

<!-- ЗАСТАВКА -->
<div class="splash">
    <div class="splash-logo">UCPUSA</div>
</div>

<!-- КОНТЕНТ СЛАЙДОВ -->
<div class="slides" id="slides">

    <!-- СТРАНИЦА 1 -->
    <div class="slide">
        <div class="title">Коммунистическая партия<br>UCPUSA</div>
        <div class="subtitle">Начинай политическую жизнь<br>в нашем Штате с нас.</div>

        <div class="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <button class="btn-main" onclick="next()">Далее</button>
        <button class="btn-skip" onclick="finish()">Пропустить</button>

        <div class="bottom-label">UCPUSA</div>
    </div>

    <!-- СТРАНИЦА 2 -->
    <div class="slide">
        <div class="title">Голос В Народы</div>
        <div class="subtitle">Стань частью красного движения<br>и помоги строить будущее.</div>

        <div class="dots">
            <div class="dot"></div>
            <div class="dot active"></div>
            <div class="dot"></div>
        </div>

        <button class="btn-main" onclick="next()">Далее</button>
        <button class="btn-skip" onclick="finish()">Пропустить</button>

        <div class="bottom-label">UCPUSA</div>
    </div>

    <!-- СТРАНИЦА 3 -->
    <div class="slide">
        <div class="title">К единству и свободе!</div>
        <div class="subtitle">Вступай в UCPUSA и прокладывай<br>новый путь вместе с нами.</div>

        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot active"></div>
        </div>

        <button class="btn-main" onclick="finish()">Начать</button>
        <button class="btn-skip" onclick="finish()">Пропустить</button>

        <div class="bottom-label">UCPUSA</div>
    </div>

</div>

<script>
    // CURRENT PAGE
    let page = 0;
    const slides = document.getElementById("slides");
    const total = 3;

    function updatePosition() {
        slides.style.transform = `translateX(-${page * 100}%)`;
    }

    function next() {
        if (page < total - 1) {
            page++;
            updatePosition();
        } else {
            finish();
        }
    }

    function finish() {
        Telegram.WebApp.sendData(JSON.stringify({ action: "finished" }));
    }

    /* СВАЙПЫ =================================== */
    let startX = 0;

    slides.addEventListener("touchstart", e => {
        startX = e.touches[0].clientX;
    });

    slides.addEventListener("touchend", e => {
        let dx = e.changedTouches[0].clientX - startX;

        if (dx < -60 && page < total - 1) { page++; }
        if (dx > 60 && page > 0) { page--; }

        updatePosition();
    });
</script>

</body>
</html>
